<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
<template id="__bundler_thumbnail" data-bg-color="#0a0a0a">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0a0a0a"></rect>
    <text x="600" y="430" text-anchor="middle" font-family="Archivo, Helvetica, sans-serif" font-weight="900" font-size="200" letter-spacing="-8" fill="#f4f1ea">K.SO<tspan fill="#d70015">*</tspan></text>
    <rect x="240" y="500" width="720" height="2" fill="#1f1f1f"></rect>
    <text x="600" y="560" text-anchor="middle" font-family="'Space Mono', monospace" font-size="34" letter-spacing="12" fill="#d70015">COMMERCIAL</text>
  </svg>
</template>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&display=swap" rel="stylesheet">
<script src="../image-slot.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0a0a0a; }
  a { color: #f4f1ea; text-decoration: none; }
  a:hover { color: #d70015; }
  @keyframes kfade { from { opacity: 0; } to { opacity: 1; } }

  /* phone layout (<=720px) — desktop untouched */
  @media (max-width: 720px) {
    [data-m~="pad"] { padding-left: 20px !important; padding-right: 20px !important; }
    [data-m~="cl"] { left: 20px !important; }
    [data-m~="cr"] { right: 20px !important; }
    [data-m~="nav"] { flex-wrap: wrap !important; gap: 14px 20px !important; padding-top: 16px !important; padding-bottom: 16px !important; }
    [data-m~="navlinks"] { flex-wrap: wrap !important; gap: 10px 16px !important; width: 100% !important; font-size: 10px !important; }
    [data-m~="sb"] { flex-wrap: wrap !important; gap: 6px 16px !important; }
    [data-m~="sb"] > * { white-space: normal !important; }
    [data-m~="stack"] { grid-template-columns: minmax(0,1fr) !important; }
    [data-m~="stack"] > div:empty { display: none !important; }
    [data-m~="nbr"] { border-right: 0 !important; border-bottom: 1px solid #1f1f1f !important; }
    [data-m~="ph"] { min-height: 0 !important; height: auto !important; }
    [data-m~="g1"] { grid-template-columns: minmax(0,1fr) !important; }
    [data-m~="g2"] { grid-template-columns: repeat(2, minmax(0,1fr)) !important; gap: 10px !important; }
    [data-m~="clients"] { grid-template-columns: repeat(2, minmax(0,1fr)) !important; }
    [data-m~="pn"] > a > span:last-child { font-size: 16px !important; }
    [data-m~="frames"] { gap: 56px !important; padding-top: 48px !important; padding-bottom: 56px !important; }
    [data-reveal-block] { grid-template-columns: minmax(0,1fr) !important; width: 100% !important; gap: 12px !important; justify-content: stretch !important; }
    [data-reveal-block] > * { grid-column: auto !important; }
    [data-reveal-block] > [data-reveal="cap"]:first-child, [data-reveal-block] > :first-child:has([data-reveal="cap"]) { order: 2; padding-bottom: 0 !important; }
    [data-m~="hide"], pre[aria-hidden] { display: none !important; }
    [data-m~="work"] { padding-bottom: 120px !important; }
    h1 { overflow-wrap: anywhere; }
  }
</style>
</helmet>

<div style="background:#0a0a0a;color:#f4f1ea;font-family:'Archivo',sans-serif;min-height:100vh;">

  <!-- nav -->
  <div data-m="nav pad" style="display:flex;justify-content:space-between;align-items:center;padding:22px 40px;border-bottom:1px solid #1f1f1f;">
    <a href="../Andrew Caso Landing - Combined.dc.html" style="display:flex;align-items:center;gap:12px;">
      <img src="../assets/logo-mark.png" alt="" style="width:34px;height:34px;object-fit:contain;" />
      <span style="font-family:'Archivo',sans-serif;font-weight:900;font-stretch:112%;font-size:20px;letter-spacing:-0.02em;text-transform:uppercase;">K.SO<span style="color:#d70015;">*</span></span>
    </a>
    <div data-m="navlinks" style="display:flex;gap:26px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#f4f1ea;">
      <a href="../Andrew Caso Landing - Combined.dc.html">Home</a>
      <a href="Commercial.dc.html" style="color:#d70015;">Commercial</a>
      <a href="../Photoshoot/Photoshoot.dc.html">Photo</a>
      <a href="../Music Videos/Music Videos.dc.html">Video</a>
      <a href="../Creative Direction/Creative Direction.dc.html">Creative Direction</a>
      <a href="../Contact.dc.html">Contact</a>
    </div>
  </div>

  <!-- page header -->
  <div data-m="pad" style="position:relative;padding:72px 40px 36px;">
    <span data-m="cl" style="position:absolute;top:30px;left:40px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.18em;color:#d70015;">K.SO / NO. 02 — PRODUCTION DESIGN</span>
    <span data-m="cr" style="position:absolute;top:30px;right:40px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.18em;color:#d70015;">{{ clock }}</span>
    <h1 style="font-family:'Archivo',sans-serif;font-weight:900;font-stretch:112%;text-transform:uppercase;font-size:clamp(46px,8.4vw,110px);line-height:0.84;letter-spacing:-0.04em;margin:0;">Commercial<span style="color:#d70015;">.</span></h1>
  </div>

  <!-- subhead -->
  <div data-m="pad sb" style="display:flex;justify-content:space-between;align-items:baseline;padding:18px 40px;border-top:1px solid #1f1f1f;border-bottom:1px solid #1f1f1f;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;">
    <span style="color:#f4f1ea;">{{ shownStr }}</span>
    <div style="position:relative;">
      <button onClick="{{ onToggleSort }}" style="appearance:none;background:none;border:0;padding:0;margin:0;cursor:pointer;display:flex;align-items:center;gap:9px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#d70015;" style-hover="color:#f4f1ea">
        <span>'19 — '26 · SORT: {{ sortLabel }}</span>
        <span style="{{ caretStyle }}">▾</span>
      </button>
      <div style="{{ menuStyle }}">
        <sc-for list="{{ sortOptions }}" as="o" hint-placeholder-count="4">
          <button onClick="{{ o.onPick }}" style="{{ o.style }}">
            <span>{{ o.label }}</span>
            <span style="{{ o.tickStyle }}">◆</span>
          </button>
        </sc-for>
      </div>
    </div>
  </div>

  <!-- work grid (2-col) -->
  <div data-m="pad" style="padding:40px;">
    <div data-m="g1" style="display:grid;grid-template-columns:repeat(2,1fr);gap:32px;">
      <sc-for list="{{ works }}" as="w" hint-placeholder-count="4">
        <a href="{{ w.page }}" onMouseEnter="{{ w.onEnter }}" onMouseLeave="{{ w.onLeave }}" style="{{ w.dimStyle }}">
          <div style="position:relative;aspect-ratio:3/2;background:#141414;border:1px solid #1f1f1f;">
            <image-slot id="{{ w.slotId }}" shape="rect" src="{{ w.src }}" placeholder="{{ w.ph }}" style="width:100%;height:100%;display:block;pointer-events:none;"></image-slot>
            <span style="{{ w.badgeStyle }}">OPEN →</span>
          </div>
          <div style="padding-top:12px;">
            <span style="display:block;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:#8a857b;margin-bottom:7px;">{{ w.eyebrow }}</span>
            <div data-m="sb" style="display:flex;justify-content:space-between;gap:16px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;">
              <span style="color:#f4f1ea;">{{ w.title }}</span>
              <span style="color:#d70015;white-space:nowrap;">{{ w.role }} · NO. {{ w.no }}</span>
            </div>
          </div>
        </a>
      </sc-for>
    </div>
  </div>

  <!-- footer -->
  <div data-m="pad" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px;padding:34px 40px;border-top:1px solid #1f1f1f;">
    <a href="mailto:andrewjcaso@gmail.com" style="font-family:'Archivo',sans-serif;font-weight:900;font-stretch:112%;text-transform:uppercase;font-size:clamp(20px,3vw,26px);letter-spacing:-0.02em;">andrewjcaso@gmail.com</a>
    <div style="display:flex;gap:22px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#f4f1ea;">
      <a href="https://www.instagram.com/andrewcaso/">Instagram</a>
      <a href="https://www.linkedin.com/in/andrew-caso-229284204">LinkedIn</a>
    </div>
    <span style="font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.14em;color:#d70015;">© '26 K.SO<span style="color:#d70015;">*</span> — LOS ANGELES</span>
  </div>



</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { clock: '', openIdx: null, hover: null, sort: 'recent', sortOpen: false };
  SORTS = [
    { id: 'recent', label: 'Recent' },
    { id: 'az',     label: 'A — Z' },
    { id: 'newest', label: 'Year ↓ New–Old' },
    { id: 'oldest', label: 'Year ↑ Old–New' },
  ];
  slug(t){return t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s*\/\s*/g,' ').replace(/[^A-Za-z0-9 ]/g,'').replace(/\s+/g,' ').trim();}

  CDN = 'https://images.squarespace-cdn.com/content/v1/6435e3fff1796c2d70570c03/';
  PROJECTS = [
    { slotId: 'com-frosty', no: '001', year: 2025, title: "Frosty's Motel", eyebrow: 'Eric Koston / SB Air Max 95', role: 'Prod Design', client: 'Nike SB', page: 'Project - Frostys Motel.dc.html', src: '../stills/frostys-motel-01.jpg' },
    { slotId: 'pr-02',      no: '002', year: 2026, title: 'No Sweat', eyebrow: 'Degree',           role: 'Prod Design', client: 'DEGREE',     src: '../stills/no-sweat-01.jpg' },
    { slotId: 'com-marathon', no: '003', year: 2026, title: 'LA Marathon 2026', eyebrow: 'Bandit Running', role: 'Prod Design', client: 'Bandit Running', page: 'Project - LA Marathon 2026.dc.html', src: '../stills/la-marathon-04.jpg' },
    { slotId: 'com-caliwater', no: '004', year: 2026, title: 'Blood Orange Cactus Water', eyebrow: 'Caliwater / Demi Lovato', role: 'Prod Design', client: 'Caliwater', page: 'Project - Blood Orange Cactus Water.dc.html', src: '../stills/caliwater-tile.jpg' },
    { slotId: 'com-bet', no: '005', year: 2025, title: 'Awards Promo 2025', eyebrow: 'BET / Kevin Hart', role: 'Prod Design', client: 'BET', page: 'Project - Awards Promo 2025.dc.html', src: '../stills/bet-awards-cover.jpg' },
    { slotId: 'com-coke',   no: '006', year: 2024, title: 'Find the way', eyebrow: 'Coke Studio / Peggy Gou', page: 'Project - Coke Studio x Peggy Gou.dc.html',  role: 'Prod Design', client: 'Coke Studio', srcId: 'c26456d0-1595-4f22-9e03-b7a607f4938f/PGXGSstill-5.jpg' },
    { slotId: 'com-adidas', no: '007', year: 2025, title: 'Crazy Lite Shorts', eyebrow: 'Adidas', page: 'Project - Adidas Crazy Lite Shorts.dc.html', role: 'Prod Design', client: 'Adidas',     srcId: 'ce07cfb2-8c44-4b80-a93c-b292a08dae6d/Screenshot+2025-05-06+at+11.56.34%E2%80%AFPM.png' },
    { slotId: 'com-beats',  no: '008', year: 2025, title: 'PowerBeats Pro 2', eyebrow: 'Beats / Open', page: 'Project - Beats x Open.dc.html',             role: 'Prod Design', client: 'Beats',      srcId: 'aeea9b8a-5f7a-4705-acff-a4e5a247a3c9/Screenshot+2025-05-05+at+3.16.11%E2%80%AFAM.png' },
    { slotId: 'com-google', no: '009', year: 2024, title: 'Chromebook + Gemini', eyebrow: 'Google', page: 'Project - Google Chromebook Gemini.dc.html', role: 'Prod Design', client: 'Google',   srcId: '0318c1b8-2667-49bb-9e28-e75bc8cec4ab/Screenshot+2025-01-23+at+3.27.45+PM.png' },
    { slotId: 'com-f45', no: '010', year: 2026, title: 'Strength For All You Carry', eyebrow: 'F45 Training', role: 'Prod Design', client: 'F45 Training', src: '../stills/f45-cover.png', page: 'Project - Strength For All You Carry.dc.html' },
    { slotId: 'com-nexxus', no: '011', year: 2025, title: 'Style Swap', eyebrow: 'Nexxus / Lindsay Lohan',               role: 'Prod Design', client: 'Nexxus',     page: 'Project - Style Swap.dc.html',     srcId: 'ee0ad8a3-6fbe-480f-8143-78d5a75d828b/Screenshot+2025-01-23+at+7.27.10+PM.png' },
    { slotId: 'com-android', no: '012', year: 2024, title: 'Galaxy Z Flip 5', eyebrow: 'Android / Baby Phat', page: 'Project - Android x Baby Phat.dc.html',     role: 'Prod Design', client: 'Android',    srcId: '3a64fa33-27ca-4781-a470-9df0e5087153/Screenshot+2025-01-23+at+4.33.32+PM.png' },
    { slotId: 'com-nike',   no: '013', year: 2024, title: 'Air max 1 Sp', page: 'Project - Nike SB x HUF.dc.html', role: 'Prod Design', client: 'Nike SB',    srcId: '03a42f1a-00d3-47d8-9505-0f9315c917c7/Screenshot+2025-01-23+at+4.57.39+PM.png' },
    { slotId: 'com-att',    no: '014', year: 2023, title: 'Dream in Black', eyebrow: 'AT&T', page: 'Project - ATT Dream in Black.dc.html', role: 'Prod Design', client: 'AT&T',       srcId: '067aac40-1dd0-4ac7-9d27-e9c8230bf751/Screenshot+2025-01-23+at+5.36.35+PM.png' },
  ];

  componentDidMount() {
    const p = (n) => String(n).padStart(2, '0');
    const tick = () => { const d = new Date(); this.setState({ clock: `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}` }); };
    tick();
    this._t = setInterval(tick, 1000);
    this._key = (e) => {
      if (this.state.openIdx === null) return;
      if (e.key === 'Escape') this.setState({ openIdx: null });
      else if (e.key === 'ArrowLeft') this.step(-1);
      else if (e.key === 'ArrowRight') this.step(1);
    };
    window.addEventListener('keydown', this._key);
    this._away = () => { if (this.state.sortOpen) this.setState({ sortOpen: false }); };
    window.addEventListener('pointerdown', this._away);
  }
  componentWillUnmount() { clearInterval(this._t); window.removeEventListener('keydown', this._key); window.removeEventListener('pointerdown', this._away); }

  sorted() {
    const rows = this.PROJECTS.map((p, i) => ({ p, i }));
    const yr = (r) => (typeof r.p.year === 'number' ? r.p.year : null);
    if (this.state.sort === 'az') {
      rows.sort((a, b) => a.p.title.localeCompare(b.p.title, 'en', { sensitivity: 'base' }));
    } else if (this.state.sort === 'newest' || this.state.sort === 'oldest') {
      const dir = this.state.sort === 'newest' ? -1 : 1;
      rows.sort((a, b) => {
        const ya = yr(a), yb = yr(b);
        if (ya === null && yb === null) return a.i - b.i;
        if (ya === null) return 1;
        if (yb === null) return -1;
        return (ya - yb) * dir || a.i - b.i;
      });
    }
    return rows.map((r) => r.p);
  }

  step(dir) { const n = this.PROJECTS.length; this.setState((s) => ({ openIdx: (s.openIdx + dir + n) % n })); }

  renderVals() {
    const hover = this.state.hover;
    const open = this.state.sortOpen;
    // eyebrow: the page's client/campaign line — em dash where the title already says it,
    // client name only for pages that have no eyebrow line of their own yet
    const norm = (s) => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    const eyebrowFor = (p) => {
      const c = p.eyebrow || p.client;
      return c && !norm(p.title).includes(norm(c)) ? c : '—';
    };
    const works = this.sorted().map((p, i) => ({
      slotId: p.slotId, no: p.no, title: p.title, eyebrow: eyebrowFor(p), role: p.role, src: p.src || (this.CDN + p.srcId + '?format=1500w'), page: p.page || ('Project - ' + this.slug(p.title) + '.dc.html'), ph: `${p.title} — drop image`,
      dimStyle: { opacity: hover !== null && hover !== i ? 0.35 : 1, transition: 'opacity 260ms cubic-bezier(0.2,0.7,0.2,1)', cursor: 'pointer', display: 'block', color: '#f4f1ea', textDecoration: 'none' },
      badgeStyle: `position:absolute;left:14px;bottom:14px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.16em;color:#f4f1ea;background:#d70015;padding:5px 9px;opacity:${hover === i ? 1 : 0};transition:opacity 200ms cubic-bezier(0.2,0.7,0.2,1);`,
      onEnter: () => this.setState({ hover: i }),
      onLeave: () => this.setState({ hover: null }),
      onOpen: () => this.setState({ openIdx: i }),
    }));
    const idx = this.state.openIdx;
    const active = idx !== null ? this.PROJECTS[idx] : {};
    const current = this.SORTS.find((s) => s.id === this.state.sort) || this.SORTS[0];
    return {
      clock: this.state.clock,
      works,
      sortLabel: current.label,
      onToggleSort: (e) => { e.stopPropagation(); this.setState({ sortOpen: !open }); },
      caretStyle: `display:inline-block;transition:transform 180ms cubic-bezier(0.2,0.7,0.2,1);transform:rotate(${open ? 180 : 0}deg);`,
      menuStyle: {
        position: 'absolute', top: 'calc(100% + 14px)', right: 0, zIndex: 30, minWidth: '208px',
        display: 'flex', flexDirection: 'column', background: '#0a0a0a', border: '1px solid #1f1f1f',
        opacity: open ? 1 : 0, visibility: open ? 'visible' : 'hidden',
        transform: open ? 'translateY(0)' : 'translateY(-4px)',
        transition: 'opacity 160ms cubic-bezier(0.2,0.7,0.2,1), transform 160ms cubic-bezier(0.2,0.7,0.2,1), visibility 160ms',
      },
      sortOptions: this.SORTS.map((s) => {
        const on = s.id === this.state.sort;
        return {
          label: s.label,
          style: `appearance:none;background:none;border:0;border-bottom:1px solid #1f1f1f;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 14px;text-align:left;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:${on ? '#d70015' : '#f4f1ea'};`,
          tickStyle: `font-size:8px;color:#d70015;opacity:${on ? 1 : 0};`,
          onPick: (e) => { e.stopPropagation(); this.setState({ sort: s.id, sortOpen: false, hover: null }); },
        };
      }),
      shownStr: `Showing ${String(this.PROJECTS.length).padStart(2, '0')} — Commercial`,
      detailOpen: idx !== null,
      active,
      activePos: idx !== null ? String(idx + 1).padStart(2, '0') : '00',
      activeTotal: String(this.PROJECTS.length).padStart(2, '0'),
      onClose: () => this.setState({ openIdx: null }),
      onPrev: () => this.step(-1),
      onNext: () => this.step(1),
      stop: (e) => e.stopPropagation(),
    };
  }
}
</script>
</body>
</html>
