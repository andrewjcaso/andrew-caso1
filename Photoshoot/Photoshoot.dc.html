<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#0a0a0a;color:#f4f1ea}</style>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="../image-slot.js"></script>
<link rel="preload" as="font" type="font/ttf" href="../assets/fonts/Staatliches-Regular.ttf" crossorigin="">
<link rel="preload" as="font" type="font/ttf" href="../assets/fonts/Gudea-Regular.ttf" crossorigin="">
<style>
  @font-face { font-family:'Staatliches'; src:url('../assets/fonts/Staatliches-Regular.ttf') format('truetype'); font-weight:400; font-display:block; }
  @font-face { font-family:'Gudea'; src:url('../assets/fonts/Gudea-Regular.ttf') format('truetype'); font-weight:400; font-style:normal; font-display:block; }
  @font-face { font-family:'Gudea'; src:url('../assets/fonts/Gudea-Bold.ttf') format('truetype'); font-weight:700; font-style:normal; font-display:block; }
  @font-face { font-family:'Gudea'; src:url('../assets/fonts/Gudea-Italic.ttf') format('truetype'); font-weight:400; font-style:italic; font-display:block; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0a0a0a; }
  a { color: #f4f1ea; text-decoration: none; }
  a:hover { color: #d70015; }
  @keyframes kfade { from { opacity: 0; } to { opacity: 1; } }

  /* phone layout (<=720px) — desktop untouched */
  @media (max-width: 720px) {
    [data-m~="pad"] { padding-left: 20px !important; padding-right: 20px !important; }
    [data-m~="cl"] { left: 20px !important; }
    [data-m~="cr"] { right: 20px !important; }
    [data-m~="nav"] { flex-wrap: wrap !important; gap: 14px 20px !important; padding-top: 16px !important; padding-bottom: 16px !important; }
    [data-m~="navlinks"] { flex-wrap: wrap !important; gap: 10px 16px !important; width: 100% !important; font-size: 10px !important; }
    [data-m~="sb"] { flex-wrap: wrap !important; gap: 6px 16px !important; }
    [data-m~="sb"] > * { white-space: normal !important; }
    [data-m~="stack"] { grid-template-columns: minmax(0,1fr) !important; }
    [data-m~="stack"] > div:empty { display: none !important; }
    [data-m~="nbr"] { border-right: 0 !important; border-bottom: 1px solid #1f1f1f !important; }
    [data-m~="ph"] { min-height: 0 !important; height: auto !important; }
    [data-m~="g1"] { grid-template-columns: minmax(0,1fr) !important; }
    [data-m~="g2"] { grid-template-columns: repeat(2, minmax(0,1fr)) !important; gap: 10px !important; }
    [data-m~="clients"] { grid-template-columns: repeat(2, minmax(0,1fr)) !important; }
    [data-m~="pn"] > a > span:last-child { font-size: 16px !important; }
    [data-m~="frames"] { gap: 56px !important; padding-top: 48px !important; padding-bottom: 56px !important; }
    [data-reveal-block] { grid-template-columns: minmax(0,1fr) !important; width: 100% !important; gap: 12px !important; justify-content: stretch !important; }
    [data-reveal-block] > * { grid-column: auto !important; }
    [data-reveal-block] > [data-reveal="cap"]:first-child, [data-reveal-block] > :first-child:has([data-reveal="cap"]) { order: 2; padding-bottom: 0 !important; }
    [data-m~="hide"], pre[aria-hidden] { display: none !important; }
    [data-m~="work"] { padding-bottom: 120px !important; }
    h1 { overflow-wrap: anywhere; }
  }
  @keyframes pagein { from { opacity:0; } to { opacity:1; } }
  @keyframes titlein { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  h1 { animation: titlein 1.1s cubic-bezier(0.2,0.6,0.2,1) 150ms both; }
  @media (prefers-reduced-motion: reduce) { h1, [data-pagein] { animation: none !important; } }
</style>
</helmet>

<div data-pagein="" style="animation:pagein 1.2s cubic-bezier(0.2,0.6,0.2,1) both;background:#0a0a0a;color:#f4f1ea;font-family:'Gudea',sans-serif;min-height:100vh;">

  <!-- nav -->
  <div data-m="nav pad" style="display:flex;justify-content:space-between;align-items:center;padding:22px 40px;border-bottom:1px solid #1f1f1f;">
    <a href="../Andrew Caso Landing - Combined.dc.html" style="display:flex;align-items:center;gap:12px;">
      <img src="../assets/logo-mark.png" alt="" style="width:34px;height:34px;object-fit:contain;" />
      <span style="font-family:'Staatliches',sans-serif;font-weight:400;-webkit-text-stroke:0.028em currentColor;paint-order:stroke fill;font-size:25px;letter-spacing:0.015em;text-transform:uppercase;">K.SO<span style="color:#d70015;">*</span></span>
    </a>
    <div data-m="navlinks" style="display:flex;gap:26px;font-family:'Gudea',sans-serif;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#f4f1ea;">
      <a href="../Andrew Caso Landing - Combined.dc.html">Home</a>
      <a href="../Commercial/Commercial.dc.html">Commercial</a>
      <a href="Photoshoot.dc.html" style="color:#d70015;">Photo</a>
      <a href="../Music Videos/Music Videos.dc.html">Video</a>
      <a href="../Creative Direction/Creative Direction.dc.html">Creative Direction</a>
      <a href="../Contact.dc.html">Contact</a>
    </div>
  </div>

  <!-- page header -->
  <div data-m="pad" style="position:relative;padding:72px 40px 36px;">
    <span data-m="cl" style="position:absolute;top:30px;left:40px;font-family:'Gudea',sans-serif;font-size:11px;letter-spacing:0.18em;color:#d70015;">K.SO / NO. 03 — PRODUCTION DESIGN</span>
    <span data-m="cr" style="position:absolute;top:30px;right:40px;font-family:'Gudea',sans-serif;font-size:11px;letter-spacing:0.18em;color:#d70015;">{{ clock }}</span>
    <h1 style="font-family:'Staatliches',sans-serif;font-weight:400;-webkit-text-stroke:0.028em currentColor;paint-order:stroke fill;text-transform:uppercase;font-size:clamp(58px,10.5vw,138px);line-height:0.84;letter-spacing:0.015em;margin:0;">Photo<span style="color:#d70015;">.</span></h1>
  </div>

  <!-- subhead -->
  <div data-m="pad sb" style="display:flex;justify-content:space-between;align-items:baseline;padding:18px 40px;border-top:1px solid #1f1f1f;border-bottom:1px solid #1f1f1f;font-family:'Gudea',sans-serif;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;">
    <span style="color:#f4f1ea;">{{ shownStr }}</span>
    <span style="color:#d70015;">'19 — '26 · SORT: RECENT</span>
  </div>

  <!-- work grid (2-col) -->
  <div data-m="pad" style="padding:40px;">
    <div data-m="g1" style="display:grid;grid-template-columns:repeat(2,1fr);gap:32px;">
      <sc-for list="{{ works }}" as="w" hint-placeholder-count="4">
        <a href="{{ w.page }}" onMouseEnter="{{ w.onEnter }}" onMouseLeave="{{ w.onLeave }}" style="{{ w.dimStyle }}">
          <div style="position:relative;aspect-ratio:3/2;background:#141414;border:1px solid #1f1f1f;">
            <image-slot id="{{ w.slotId }}" shape="rect" src="{{ w.src }}" placeholder="{{ w.ph }}" style="width:100%;height:100%;display:block;pointer-events:none;"></image-slot>
            <span style="{{ w.badgeStyle }}">OPEN →</span>
          </div>
          <div style="padding-top:12px;">
            <span style="display:block;font-family:'Gudea',sans-serif;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:#8a857b;margin-bottom:7px;">{{ w.eyebrow }}</span>
            <div data-m="sb" style="display:flex;justify-content:space-between;gap:16px;font-family:'Gudea',sans-serif;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;">
              <span style="color:#f4f1ea;">{{ w.title }}</span>
              <span style="color:#d70015;white-space:nowrap;">{{ w.role }} · NO. {{ w.no }}</span>
            </div>
          </div>
        </a>
      </sc-for>
    </div>
  </div>

  <!-- footer -->
  <div data-m="pad" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px;padding:34px 40px;border-top:1px solid #1f1f1f;">
    <a href="mailto:andrewjcaso@gmail.com" style="font-family:'Staatliches',sans-serif;font-weight:400;-webkit-text-stroke:0.028em currentColor;paint-order:stroke fill;text-transform:uppercase;font-size:clamp(25px,3.8vw,33px);letter-spacing:0.015em;">andrewjcaso@gmail.com</a>
    <div style="display:flex;gap:22px;font-family:'Gudea',sans-serif;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#f4f1ea;">
      <a href="https://www.instagram.com/andrewcaso/">Instagram</a>
      <a href="https://www.linkedin.com/in/andrew-caso-229284204">LinkedIn</a>
    </div>
    <span style="font-family:'Gudea',sans-serif;font-size:10px;letter-spacing:0.14em;color:#d70015;">© '26 K.SO<span style="color:#d70015;">*</span> — LOS ANGELES</span>
  </div>



</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { clock: '', openIdx: null, hover: null };
  slug(t){return t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s*\/\s*/g,' ').replace(/[^A-Za-z0-9 ]/g,'').replace(/\s+/g,' ').trim();}

  CDN = 'https://images.squarespace-cdn.com/content/v1/6435e3fff1796c2d70570c03/';
  PROJECTS = [
    { slotId: 'ph-hardstone',   no: '015', title: 'Hardstone Psycho',        role: 'Cover Art',   client: 'Don Toliver',       srcId: '264c9b78-4fa4-44c4-bc71-dc869d8c8c09/tempImagekFuxQW.jpg' },
    { slotId: 'ph-albumrollout', no: '070', title: 'Album Rollout',            role: 'Editorial',   client: 'Leah Kate',         src: '../stills/album-rollout-05.jpg' },
    { slotId: 'ph-obsessed',    no: '069', title: 'Obsessed Fest',            role: 'Editorial', client: 'Cosmopolitan',      src: '../stills/obsessed-fest-cover.jpg' },
    { slotId: 'ph-visiontool',  no: '072', title: 'Vision Tool',              role: 'Commercial',  client: 'Tombogo x Vooglam', src: '../stills/vision-tool-01.jpg' },
    { slotId: 'ph-puma',        no: '016', title: 'SPorts Club Collection', role: 'Commercial', client: 'Puma', eyebrow: 'Puma x Kid Super Studios', page: 'Project - Puma x Kid Super Studios.dc.html',              srcId: 'c2eca58f-9a56-4fb7-a675-53ff333833c0/435894374_18427009822050246_8837608129971631954_n.jpg' },
    { slotId: 'ph-magcover',    no: '071', title: 'Magazine Cover',           role: 'Editorial',   client: 'HighSnobiety',      src: '../stills/magazine-cover-tile.jpg' },
    { slotId: 'ph-nikefl',      no: '017', title: 'Nike / FL x Swarovski',   role: 'Commercial', client: 'Nike / Foot Locker', srcId: '7398cd75-571d-49c3-a0d4-67f8030eb771/p49_20241016_Nike_FootLocker_SwarovskiAirMax_L02S03_0222-v2-16x9.jpg' },
    { slotId: 'ph-adidasbape',  no: '018', title: 'Adidas Golf x Bape',      role: 'Commercial', client: 'Adidas',            srcId: '1f62f64a-9141-4420-98cf-1c89d6b67e42/1A75F554-7A33-4266-80EA-DAA1B371947F.jpeg' },
    { slotId: 'ph-gq',          no: '019', title: 'GQ x Louboutin',          role: 'Editorial', client: 'GQ',                src: '../stills/gq-hero-rotated.jpg' },
    { slotId: 'ph-nikediamond', no: '020', title: 'Nike Diamond',            role: 'Commercial', client: 'Nike',              srcId: 'f0ee0297-8cbd-4f86-a09f-67c311fd4460/tempImageor9yE2.jpg' },
    { slotId: 'ph-skims',       no: '021', title: 'Skims Men',               role: 'Commercial', client: 'Skims',             srcId: 'a3bbac5e-ac92-4474-9cd0-9f6e792ddb94/tempImagevUBrb9.jpg' },
    { slotId: 'ph-adidas100t',  no: '022', title: 'Adidas x 100T',           role: 'Commercial', client: 'Adidas',            srcId: '21cd190d-fa0d-49aa-9ac2-26672705a9c4/03_AC_FW24_100T_ADIDAS_ORIGINALS_IDIE3413_APRIL_M_0843.jpg' },
    { slotId: 'ph-guess',       no: '023', title: 'Guess Originals',         role: 'Commercial', client: 'Guess',             srcId: '02ea38c0-2b78-48e9-99d5-e7112c3b900f/1.jpg' },
    { slotId: 'ph-brodie',      no: '024', title: 'Brodie World',            role: 'Cover Art',   client: 'AG Club',                 srcId: '70bad8a7-93af-48c3-b819-f0877d75316f/tempImageyWjGrX.jpg' },
    { slotId: 'ph-nasty',       no: '025', title: 'Nasty — Tinashe',         role: 'Cover Art',   client: 'Tinashe',           srcId: 'af597069-bcd3-4ca5-891b-f2cb7c6e8b5a/435895393_18423315049012581_5796269924362516235_n.jpg' },
    { slotId: 'ph-blues',       no: '026', title: 'My 21st Century Blues',   role: 'Cover Art',   client: 'RAYE',              srcId: '5f610c44-dee8-4582-b429-f0be1a4759a1/DC5B7394-BD1B-4072-BF4F-6D8794EAD3F3.jpg' },
  ];

  componentDidMount() {
    const p = (n) => String(n).padStart(2, '0');
    const tick = () => { const d = new Date(); this.setState({ clock: `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}` }); };
    tick();
    this._t = setInterval(tick, 1000);
    this._key = (e) => {
      if (this.state.openIdx === null) return;
      if (e.key === 'Escape') this.setState({ openIdx: null });
      else if (e.key === 'ArrowLeft') this.step(-1);
      else if (e.key === 'ArrowRight') this.step(1);
    };
    window.addEventListener('keydown', this._key);
  }
  componentWillUnmount() { clearInterval(this._t); window.removeEventListener('keydown', this._key); }

  step(dir) { const n = this.PROJECTS.length; this.setState((s) => ({ openIdx: (s.openIdx + dir + n) % n })); }

  renderVals() {
    const hover = this.state.hover;
    // eyebrow: client/campaign line — em dash where the title already says it
    const norm = (s) => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    const eyebrowFor = (p) => {
      if (p.eyebrow) return p.eyebrow;
      const c = p.client;
      return c && c !== '—' ? c : '—';
    };
    const works = this.PROJECTS.map((p, i) => ({
      slotId: p.slotId, no: p.no, title: p.title, role: p.role, eyebrow: eyebrowFor(p), src: p.src || (this.CDN + p.srcId + '?format=1500w'), page: p.page || ('Project - ' + this.slug(p.title) + '.dc.html'), ph: `${p.title} — drop image`,
      dimStyle: { opacity: hover !== null && hover !== i ? 0.35 : 1, transition: 'opacity 260ms cubic-bezier(0.2,0.7,0.2,1)', cursor: 'pointer', display: 'block', color: '#f4f1ea', textDecoration: 'none' },
      badgeStyle: `position:absolute;left:14px;bottom:14px;font-family:'Gudea',sans-serif;font-size:10px;letter-spacing:0.16em;color:#f4f1ea;background:#d70015;padding:5px 9px;opacity:${hover === i ? 1 : 0};transition:opacity 200ms cubic-bezier(0.2,0.7,0.2,1);`,
      onEnter: () => this.setState({ hover: i }),
      onLeave: () => this.setState({ hover: null }),
      onOpen: () => this.setState({ openIdx: i }),
    }));
    const idx = this.state.openIdx;
    const active = idx !== null ? this.PROJECTS[idx] : {};
    return {
      clock: this.state.clock,
      works,
      shownStr: `Showing ${String(this.PROJECTS.length).padStart(2, '0')} — Photo`,
      detailOpen: idx !== null,
      active,
      activePos: idx !== null ? String(idx + 1).padStart(2, '0') : '00',
      activeTotal: String(this.PROJECTS.length).padStart(2, '0'),
      onClose: () => this.setState({ openIdx: null }),
      onPrev: () => this.step(-1),
      onNext: () => this.step(1),
      stop: (e) => e.stopPropagation(),
    };
  }
}
</script>
</body>
</html>
